].map(l=>l.split('\n').map(r=>{const[p,t,o,a]=r.split('|');return{p,t,o:o.split(';'),a:+a}}));
const INTRO=["Hello! I'm Copy. In this level we use There is for one thing, and There are for many things. In negative sentences we say there isn't and there aren't. For questions, we say Is there? and Are there? Look carefully at the pictures and count. Good luck!",
"Welcome to level two! Use much and how much with things you can't count, like water. Use many and how many with things you can count, like pillows. A lot of works with both. Use a before a consonant sound, and an before a vowel sound. Some is for positive sentences, and any is for negatives and questions.",
"Level three! Object pronouns come after a verb. They are me, you, him, her, it, us and them. For example: I like Alba, so I like her. Think about who or what the sentence is about. Is it one person, or more? Is it a thing? You can do it!"];
const CR={1:'CE1 · Criterio 1.1: Comprende el sentido global y la información específica de textos escritos y multimodales (imágenes) sencillos sobre temas cotidianos.',2:'CE2 · Criterio 2.2: Usa con corrección las estructuras gramaticales y el léxico trabajados (there is/are, cuantificadores, pronombres) en frases breves.',5:'CE5 · Criterio 5.1: Reflexiona sobre el funcionamiento de la lengua inglesa y amplía su repertorio léxico (hogar y material escolar).'};
const cr=q=>q.p?1:/^Which/.test(q.t)?5:2;
const NM=['There is / There are','Quantifiers','Object pronouns'];
const $=s=>document.querySelector(s);let S=null;
const key=()=>'copy2eso:'+(S.name+'|'+S.grp).toLowerCase();
const sv=()=>{try{localStorage.setItem(key(),JSON.stringify(S));localStorage.setItem('copy2eso:last',JSON.stringify([S.name,S.grp]))}catch(e){}};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500)};
function say(t,v=1){$('#bub').textContent=t;const ss=window.speechSynthesis,m=f=>{const c=$('#cat');c&&c.classList[f]('talk')};
 try{ss&&ss.cancel()}catch(e){}
 if(!v)return;
 if(!ss||!window.SpeechSynthesisUtterance){m('add');setTimeout(()=>m('remove'),5000);return}
 const u=new SpeechSynthesisUtterance(t),vs=ss.getVoices().filter(x=>/en[-_]GB/i.test(x.lang));
 u.voice=vs.find(x=>/daniel|george|arthur|oliver|ryan|male/i.test(x.name)&&!/female/i.test(x.name))||vs[0]||null;
 u.lang='en-GB';u.pitch=.85;u.rate=.88;u.onstart=()=>m('add');u.onend=u.onerror=()=>m('remove');ss.speak(u)}
function shell(q){$('#w').className='wrap'+(q?' q':'');$('#bh').style.display=$('#bo').style.display=S?'':'none'}
function login(){S=null;shell();let l=['',''];try{l=JSON.parse(localStorage.getItem('copy2eso:last'))||l}catch(e){}
 $('#main').innerHTML=`<div class=card><h2>👋 ¡Hola! Identifícate para empezar</h2><label>Nombre y apellidos<input id=n value="${l[0]}" maxlength=60></label><label>Curso / grupo (ej. 2ºB)<input id=g value="${l[1]}" maxlength=12></label><button onclick="enter()">🚀 Entrar / Continuar</button><p style="font-size:.9rem">Si ya empezaste, escribe el mismo nombre y grupo y seguirás donde lo dejaste.</p></div>`;
 say("Hi! I'm Copy. Write your name to start.",0)}
function enter(){const n=$('#n').value.trim(),g=$('#g').value.trim();if(!n)return toast('Escribe tu nombre');
 const k='copy2eso:'+(n+'|'+g).toLowerCase();let o=null;try{o=JSON.parse(localStorage.getItem(k))}catch(e){}
 S=o||{name:n,grp:g,done:[0,0,0],ans:[0,1,2].map(()=>Array(20).fill(null)),l:0,i:0};sv();home(o?'Welcome back, '+n+'! Let\'s continue.':'Hello, '+n+'! Choose your level.')}
function logout(){try{speechSynthesis.cancel()}catch(e){}login()}
const sc=l=>D[l].filter((q,i)=>S.ans[l][i]===q.a).length;
const an=l=>S.ans[l].filter(x=>x!=null).length;
function home(m){shell();say(m||'Choose your level!',m?1:0);
 $('#main').innerHTML=`<div class=card><h2>¡Hola, ${S.name}! 🎒</h2>`+[0,1,2].map(l=>{const d=S.done[l],ok=l==0||S.done[l-1];
 return`<div class="lv l${l} ${ok?'':'lock'}"><div><b>Level ${l+1} · ${NM[l]}</b><small>${d?'✅ Nota: '+(sc(l)/2).toFixed(1)+' / 10':ok?an(l)+'/20 respondidas':'🔒 Termina el nivel anterior'}</small></div>${ok?`<button onclick="${d?`res(${l})`:`intro(${l})`}">${d?'Ver resultados':an(l)?'Continuar':'Empezar'}</button>`:''}</div>`}).join('')+'</div>'}
function intro(l){S.l=l;S.fc=0;shell();$('#main').innerHTML=`<div class=card><h2>Level ${l+1}: ${NM[l]}</h2><p>Copy te explica el nivel en inglés. ¡Escucha con atención!</p><button class=sm onclick="say(INTRO[${l}])">🔊 Escuchar otra vez</button> <button onclick="Q(${S.ans[l].findIndex(x=>x==null)<0?0:S.ans[l].findIndex(x=>x==null)})">▶ Empezar el test</button></div>`;say(INTRO[l])}

 <div class=dots>${D[l].map((_,k)=>`<i class="${a[k]!=null?'on':''} ${k==S.i?'cur':''}" onclick="Q(${k})">${k+1}</i>`).join('')}</div>

 ${q.o.map((o,k)=>`<button class="opt ${a[S.i]===k?'sel':''}" onclick="pick(${k})"><b>${'ABC'[k]}</b>${o}</button>`).join('')}

function res(l){shell();const c=sc(l),g=c/2,er=D[l].map((q,i)=>({q,i})).filter(x=>S.ans[l][x.i]!==x.q.a);

 <div class=nav><button onclick="home()">🏠 Niveles</button><button class=pdf style="color:#3a2d00" onclick="dl()">📄 Informe PDF</button></div></div>`}
function pdf(){const {jsPDF}=window.jspdf,d=new jsPDF(),cl=s=>String(s).replace(/[^\x20-\x7E\u00A0-\u00FF]/g,'');let y=0;
 const T=(s,sz=10,b=0,x=15,col=[40,40,60])=>{d.setFontSize(sz);d.setFont('helvetica',b?'bold':'normal');d.setTextColor(...col);d.splitTextToSize(cl(s),180-(x-15)).forEach(t=>{if(y>282){d.addPage();y=18}d.text(t,x,y);y+=sz*.42+1.6})};
 const bar=(p,lbl)=>{if(y>270){d.addPage();y=18}d.setFillColor(233,228,255);d.rect(15,y,110,5,'F');d.setFillColor(39,182,165);d.rect(15,y,1.1*p,5,'F');d.setTextColor(40,40,60);d.setFontSize(10);d.text(lbl,130,y+4);y+=9};
 d.setFillColor(255,138,61);d.rect(0,0,210,28,'F');d.setTextColor(255,255,255);d.setFont('helvetica','bold');d.setFontSize(17);d.text("Copy's English Adventure - Informe final",15,13);d.setFontSize(10);d.text('Ingles 2 ESO (A2) - LOMLOE / Andalucia (Decreto 102/2023)',15,21);y=38;
 T('Alumno/a: '+S.name+'   Grupo: '+(S.grp||'-')+'   Fecha: '+new Date().toLocaleDateString('es-ES'),11,1);y+=2;
 const L=[0,1,2].map(l=>({l,d:S.done[l],g:sc(l)/2})),fd=L.filter(x=>x.d),m=fd.length?(fd.reduce((s,x)=>s+x.g,0)/fd.length).toFixed(1):'-';
 T('Nota media (sobre 10): '+m+'   ·   Niveles completados: '+fd.length+'/3',13,1,15,[255,111,145]);y+=2;
 T('Calificacion por nivel',12,1);L.forEach(x=>bar(x.d?x.g*10:0,'Level '+(x.l+1)+' '+NM[x.l]+': '+(x.d?x.g.toFixed(1)+'/10':'pendiente')));y+=3;
 T('Criterios de evaluacion - porcentaje de consecucion',12,1);const t={1:[0,0],2:[0,0],5:[0,0]};
